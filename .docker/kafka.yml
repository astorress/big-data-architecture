# Kafka en modo KRaft (sin ZooKeeper): tres brokers que además forman el quórum de controladores.
# Cada tema se reparte en particiones y cada partición tiene 3 réplicas, una por broker.
# Dentro de Docker se usa kafka1:9092,kafka2:9092,kafka3:9092; desde el host, localhost:19092-19094.

x-kafka: &kafka
  image: apache/kafka:4.3.1
  restart: unless-stopped
  env_file:
    - ../.envs/kafka.env

services:

  kafka1:
    <<: *kafka
    container_name: 'BigDataKafka1'
    hostname: kafka1
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka1:9092,EXTERNAL://localhost:19092
    ports:
      - 19092:19092
    volumes:
      - kafka1-data:/var/lib/kafka/data
  kafka2:
    <<: *kafka
    container_name: 'BigDataKafka2'
    hostname: kafka2
    environment:
      KAFKA_NODE_ID: 2
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka2:9092,EXTERNAL://localhost:19093
    ports:
      - 19093:19092
    volumes:
      - kafka2-data:/var/lib/kafka/data
  kafka3:
    <<: *kafka
    container_name: 'BigDataKafka3'
    hostname: kafka3
    environment:
      KAFKA_NODE_ID: 3
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka3:9092,EXTERNAL://localhost:19094
    ports:
      - 19094:19092
    volumes:
      - kafka3-data:/var/lib/kafka/data

volumes:
  kafka1-data:
  kafka2-data:
  kafka3-data:
