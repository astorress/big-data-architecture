# Logs del driver: solo advertencias y errores, para que la salida de las lecciones se lea bien
rootLogger.level = warn
rootLogger.appenderRef.stdout.ref = console
appender.console.type = Console
appender.console.name = console
appender.console.target = SYSTEM_ERR
appender.console.layout.type = PatternLayout
appender.console.layout.pattern = %d{HH:mm:ss} %p %c{1}: %m%n%ex
# Las bibliotecas nativas de Hadoop son de x86: en ARM se usan las implementaciones en Java
logger.native.name = org.apache.hadoop.util.NativeCodeLoader
logger.native.level = error
# Avisos esperables en este laboratorio que no aportan a la salida de las lecciones
logger.yarnclient.name = org.apache.spark.deploy.yarn.Client
logger.yarnclient.level = error
logger.streamaqe.name = org.apache.spark.sql.execution.streaming.runtime.ResolveWriteToStream
logger.streamaqe.level = error
logger.microbatch.name = org.apache.spark.sql.execution.streaming.runtime.MicroBatchExecution
logger.microbatch.level = error
logger.dagscheduler.name = org.apache.spark.scheduler.DAGScheduler
logger.dagscheduler.level = error
logger.trigger.name = org.apache.spark.sql.execution.streaming.runtime.ProcessingTimeExecutor
logger.trigger.level = error
logger.planstring.name = org.apache.spark.util.SparkStringUtils
logger.planstring.level = error
