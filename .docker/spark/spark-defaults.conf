# Configuración de Spark para todas las aplicaciones del laboratorio (SPARK_CONF_DIR=/app/.docker/spark).
# Cada lección puede sobrescribir cualquier valor al crear su SparkSession.

# YARN reparte los recursos: 2 ejecutores de 2 núcleos, uno por NodeManager si hay espacio.
# La memoria es justa a propósito: el clúster completo debe caber en ~8 GB de Docker junto con VS Code.
spark.executor.instances           2
spark.executor.cores               2
spark.executor.memory              512m
spark.executor.memoryOverhead      256m
# En modo cliente el driver corre aquí (contenedor lab); en YARN solo vive un ApplicationMaster pequeño
spark.driver.memory                768m
spark.yarn.am.memory               256m
spark.yarn.am.memoryOverhead       256m
# Los jars de Spark se subieron a HDFS una vez (entrypoint.sh): YARN los reparte y los guarda en caché en cada nodo
spark.yarn.archive                 hdfs:///spark/spark-jars.zip

# Los ejecutores se conectan de vuelta al driver por el nombre del contenedor del laboratorio
spark.driver.host                  lab
spark.driver.bindAddress           0.0.0.0

# SQL: pocas particiones de shuffle para un clúster pequeño (el valor por defecto es 200)
spark.sql.shuffle.partitions       8
spark.sql.session.timeZone         America/Bogota
spark.sql.warehouse.dir            hdfs:///warehouse

spark.ui.showConsoleProgress       false
